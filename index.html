<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Trening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171B;
    --surface:#1F2227;
    --surface2:#282C32;
    --line:#34383F;
    --text:#EDEAE2;
    --text-dim:#8D9199;
    --accent:#C98A3B;
    --accent-dim:#8a621f;
    --good:#6FA88A;
    --rest:#C1584B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{color:inherit;font-family:inherit;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative;}
  h1,h2,h3,.num{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  .topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .plan-label{font-family:'Oswald';font-size:20px;font-weight:600;}
  .topbar .date-label{color:var(--text-dim);font-size:13px;}
  .icon-btn{background:none;border:none;color:var(--text-dim);font-size:14px;padding:6px 10px;border-radius:8px;}
  .icon-btn:active{background:var(--surface2);}

  .home{padding:22px 18px;}
  .home h1{font-size:15px;color:var(--text-dim);margin:0 0 4px;letter-spacing:.1em;}
  .home .sub{font-size:13px;color:var(--text-dim);margin-bottom:22px;}
  .plan-grid{display:flex;flex-direction:column;gap:12px;}
  .plan-btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;display:flex;align-items:center;justify-content:space-between;text-align:left;}
  .plan-btn:active{background:var(--surface2);}
  .plan-btn .letter{font-family:'Oswald';font-size:30px;font-weight:700;color:var(--accent);width:44px;}
  .plan-btn .meta{flex:1;margin-left:8px;}
  .plan-btn .meta .name{font-family:'Oswald';font-size:16px;color:var(--text);}
  .plan-btn .meta .exs{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .resume-banner{background:var(--surface2);border:1px solid var(--accent-dim);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
  .resume-banner button{background:var(--accent);color:#1a1200;border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;}
  .link-row{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .link-row button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 8px;font-size:12.5px;}

  .session-list{padding:14px;display:flex;flex-direction:column;gap:12px;}
  .ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ex-name-input{background:none;border:none;color:var(--text);font-family:'Oswald';font-size:16px;font-weight:600;width:100%;padding:0;text-transform:uppercase;letter-spacing:.02em;}
  .ex-name-input:focus{outline:none;border-bottom:1px dashed var(--accent);}
  .plan-tag{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .rest-badge{flex-shrink:0;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
  .rest-badge:active{background:var(--line);}
  .last-time{font-size:12px;color:var(--text-dim);margin-top:6px;}
  .ctx-input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:7px 9px;margin-top:8px;}
  .ctx-input::placeholder{color:#5c6067;}

  .sets{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .set-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:8px;padding:7px 10px;font-size:14px;}
  .set-row .idx{color:var(--text-dim);font-size:12px;width:16px;}
  .set-row .val{font-family:'Oswald';font-variant-numeric:tabular-nums;flex:1;}
  .set-row .note{color:var(--accent);font-size:12px;flex-shrink:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .set-row .del{background:none;border:none;color:var(--text-dim);font-size:16px;padding:0 2px;}

  .add-set{display:flex;gap:6px;margin-top:10px;}
  .add-set input{width:0;flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 6px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;}
  .add-set input::placeholder{color:#5c6067;font-size:12px;}
  .add-set button{flex-shrink:0;background:var(--accent);border:none;border-radius:8px;color:#1a1200;font-weight:700;font-size:13px;padding:0 12px;}
  .quick-row{margin-top:6px;}
  .quick-row button{background:none;border:1px dashed var(--line);color:var(--text-dim);border-radius:8px;font-size:12px;padding:5px 10px;}

  .finish-bar{padding:6px 14px 20px;}
  .finish-bar button{width:100%;background:var(--good);border:none;color:#0f2119;font-weight:700;font-size:15px;border-radius:12px;padding:14px;font-family:'Oswald';letter-spacing:.03em;text-transform:uppercase;}

  .rest-bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 -8px 24px rgba(0,0,0,.35);z-index:10;}
  .ring-wrap{position:relative;width:56px;height:56px;flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-wrap .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:16px;font-variant-numeric:tabular-nums;}
  .rest-info{flex:1;}
  .rest-info .lbl{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;}
  .rest-info .ex{font-family:'Oswald';font-size:14px;}
  .rest-actions{display:flex;gap:6px;}
  .rest-actions button{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:12px;padding:8px 10px;}

  .history-view{padding:16px;}
  .qa-plan-row{display:flex;gap:8px;margin-bottom:16px;}
  .qa-plan-row button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-family:'Oswald';font-size:16px;}
  .qa-plan-row button.active{background:var(--accent);color:#1a1200;border-color:var(--accent);}
  .qa-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .qa-row-head{display:flex;gap:6px;align-items:center;}
  .qa-row-head input.qa-name{flex:1;background:none;border:none;color:var(--text);font-family:'Oswald';font-size:15px;text-transform:uppercase;padding:0;}
  .qa-unit-btn{flex-shrink:0;background:var(--surface2);border:1px solid var(--line);color:var(--text-dim);border-radius:8px;font-size:11px;padding:5px 8px;}
  .qa-del-row{background:none;border:none;color:var(--text-dim);font-size:16px;padding:0 4px;}
  .qa-sets-input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 9px;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums;}
  .qa-sets-input::placeholder{color:#5c6067;}
  .qa-ctx-input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 9px;font-size:12px;margin-top:6px;}
  .qa-addrow-btn{width:100%;background:none;border:1px dashed var(--line);color:var(--text-dim);border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px;}
  .qa-date-input{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px;}
  .qa-hint{font-size:11px;color:var(--text-dim);margin:-8px 0 16px;line-height:1.5;}
  .qa-save-bar{padding:6px 0 20px;}
  .qa-save-bar button{width:100%;background:var(--good);border:none;color:#0f2119;font-weight:700;font-size:15px;border-radius:12px;padding:14px;font-family:'Oswald';letter-spacing:.03em;text-transform:uppercase;}
  .history-view select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:14px;margin-bottom:16px;}
  .hist-entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .hist-entry .d{font-family:'Oswald';font-size:13px;color:var(--accent);display:flex;justify-content:space-between;}
  .hist-entry .edit-hint{font-size:11px;color:var(--text-dim);text-decoration:underline;}
  .hist-entry .p{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .hist-entry .sets-line{font-size:13px;font-variant-numeric:tabular-nums;}
  .empty{color:var(--text-dim);font-size:13px;text-align:center;padding:30px 10px;}

  .chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;}
  .chart-wrap .ct{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .chart-wrap svg{width:100%;height:auto;display:block;}

  .pe-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .pe-row input.pe-name{flex:1;background:none;border:none;color:var(--text);font-family:'Oswald';font-size:14px;text-transform:uppercase;padding:0;min-width:0;}
  .pe-row .pe-rest-input{width:48px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:12px;text-align:center;padding:5px 2px;}
  .pe-row button{flex-shrink:0;background:var(--surface2);border:1px solid var(--line);color:var(--text-dim);border-radius:6px;font-size:12px;padding:5px 7px;}
  .pe-addrow-btn{width:100%;background:none;border:1px dashed var(--line);color:var(--text-dim);border-radius:10px;padding:12px;font-size:13px;margin:4px 0 16px;}
  .pe-reset-btn{width:100%;background:none;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;padding:8px;}
  .pe-planname{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:'Oswald';font-size:16px;padding:12px;margin-bottom:14px;}

  .stat-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .stat-row .nm{font-family:'Oswald';font-size:14px;flex:1;text-transform:uppercase;}
  .stat-row .pr{font-family:'Oswald';font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums;}
  .stat-row .dt{font-size:11px;color:var(--text-dim);}
  .stat-summary{display:flex;gap:10px;margin-bottom:18px;}
  .stat-summary .box{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;}
  .stat-summary .box .n{font-family:'Oswald';font-size:24px;color:var(--accent);}
  .stat-summary .box .l{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-size:16px;}
  .cal-head .m{font-family:'Oswald';font-size:16px;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--text-dim);padding-bottom:4px;}
  .cal-day{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;}
  .cal-day.has{border-color:var(--accent);}
  .cal-day .dn{color:var(--text-dim);}
  .cal-day .pl{font-family:'Oswald';font-size:13px;color:var(--accent);margin-top:2px;}
  .cal-day.empty{background:none;border:none;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const DEFAULT_PLANS = {
  A: { name:'Trening A', exercises:[
    {id:'a1', name:'Przysiady ze sztangą', unit:'reps', rest:150},
    {id:'a2', name:'Wyciskanie hantli na skosie dodatnim', unit:'reps', rest:90},
    {id:'a3', name:'Wiosłowanie hantlą jednorącz', unit:'reps', rest:75},
    {id:'a4', name:'Unoszenie hantli bokiem (lateral raise)', unit:'reps', rest:60},
    {id:'a5', name:'Sztanga łamana', unit:'reps', rest:75},
    {id:'a6', name:'Plank', unit:'sec', rest:60},
  ]},
  B: { name:'Trening B', exercises:[
    {id:'b1', name:'Martwy ciąg klasyczny', unit:'reps', rest:180},
    {id:'b2', name:'Overhead Press (OHP)', unit:'reps', rest:120},
    {id:'b3', name:'Wiosłowanie sztangą podchwytem', unit:'reps', rest:90},
    {id:'b4', name:'Face Pulls', unit:'reps', rest:60},
    {id:'b5', name:'Prostowanie ramion na wyciągu', unit:'reps', rest:60},
    {id:'b6', name:'Plank', unit:'sec', rest:60},
  ]},
  C: { name:'Trening C', exercises:[
    {id:'c1', name:'Wyciskanie sztangi leżąc', unit:'reps', rest:150},
    {id:'c2', name:'Leg press (suwnica)', unit:'reps', rest:120},
    {id:'c3', name:'Ściąganie drążka wyciągu do klatki', unit:'reps', rest:90},
    {id:'c4', name:'Arnold press', unit:'reps', rest:90},
    {id:'c5', name:'Uginanie ramion młotkowo', unit:'reps', rest:60},
    {id:'c6', name:'Plank', unit:'sec', rest:60},
  ]},
};

let sessions = [];
let active = null;
let restOverrides = {};
let PLANS = null;
let view = 'home';
let timer = { running:false, remaining:0, total:0, entryIdx:-1, exName:'', handle:null };

function clonePlans(){ return JSON.parse(JSON.stringify(DEFAULT_PLANS)); }

const LS_PREFIX = 'trening_app_';
const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

async function stGet(key, fallback){
  try{
    if(hasClaudeStorage){
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : fallback;
    }
    if(typeof localStorage !== 'undefined'){
      const raw = localStorage.getItem(LS_PREFIX+key);
      return raw != null ? JSON.parse(raw) : fallback;
    }
  } catch(e){ console.error('storage get error', e); }
  return fallback;
}
async function stSet(key, val){
  try{
    if(hasClaudeStorage){
      await window.storage.set(key, JSON.stringify(val));
      return;
    }
    if(typeof localStorage !== 'undefined'){
      localStorage.setItem(LS_PREFIX+key, JSON.stringify(val));
    }
  } catch(e){ console.error('storage set error', e); }
}

function uid(p){ return p+'_'+Date.now()+'_'+Math.floor(Math.random()*1000); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pl-PL', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function effectiveRest(name, planRest){
  return restOverrides[name] != null ? restOverrides[name] : planRest;
}
function unitLabel(u){ return u==='sec' ? 's' : 'x'; }

function setsSummary(sets, unit){
  if(!sets.length) return '—';
  return sets.map(s => {
    let t = s.value + (unit==='sec' ? 's' : '');
    if(s.weight!=null && s.weight!=='') t += '×'+s.weight+'kg';
    return t;
  }).join(', ');
}

function lastEntryFor(name, excludeSessionId){
  for(let i=sessions.length-1; i>=0; i--){
    const s = sessions[i];
    if(s.id===excludeSessionId) continue;
    for(let j=s.entries.length-1; j>=0; j--){
      if(s.entries[j].performedName === name) return {session:s, entry:s.entries[j]};
    }
  }
  return null;
}

function render(){
  const root = document.getElementById('root');
  if(view==='home') root.innerHTML = renderHome();
  else if(view==='session') root.innerHTML = renderSession();
  else if(view==='history') root.innerHTML = renderHistory();
  else if(view==='quickadd') root.innerHTML = renderQuickAdd();
  else if(view==='stats') root.innerHTML = renderStats();
  else if(view==='calendar') root.innerHTML = renderCalendar();
  else if(view==='editplans') root.innerHTML = renderPlansEdit();
  else if(view==='editsession') root.innerHTML = renderEditSession();
  bindEvents();
  renderRestBar();
}

function renderHome(){
  const last = sessions[sessions.length-1];
  let resume = '';
  if(active){
    resume = `<div class="resume-banner">
      <div>
        <div style="font-size:13px;">Trening ${active.plan} w toku</div>
        <div style="font-size:11px;color:var(--text-dim);">${fmtDate(active.date)}</div>
      </div>
      <button data-action="resume">Kontynuuj</button>
    </div>`;
  }
  let lastInfo = last ? `Ostatni trening: ${fmtDate(last.date)} — Trening ${last.plan}` : 'Brak zapisanych treningów.';
  let storageNote = !hasClaudeStorage ? `<div style="font-size:11px;color:var(--text-dim);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:16px;">Dane zapisują się lokalnie w tej przeglądarce na tym urządzeniu. Otwieraj apkę zawsze tym samym linkiem/plikiem, żeby mieć dostęp do historii.</div>` : '';
  let grid = Object.keys(PLANS).map(key=>{
    const p = PLANS[key];
    return `<button class="plan-btn" data-action="start" data-plan="${key}">
      <div class="letter">${key}</div>
      <div class="meta">
        <div class="name">${p.name}</div>
        <div class="exs">${p.exercises.map(e=>e.name).join(' · ')}</div>
      </div>
    </button>`;
  }).join('');
  return `
    <div class="home">
      <h1>Dziennik treningowy</h1>
      <div class="sub">${lastInfo}</div>
      ${storageNote}
      ${resume}
      <div class="plan-grid">${grid}</div>
      <div class="link-row">
        <button data-action="history">Historia ćwiczeń</button>
        <button data-action="stats">Statystyki / PR-y</button>
        <button data-action="calendar">Kalendarz</button>
        <button data-action="editplans">Edytuj plany</button>
        <button data-action="quickadd" style="grid-column:1/-1;">+ Dodaj starą sesję</button>
      </div>
    </div>`;
}

function renderSession(){
  const plan = PLANS[active.plan];
  const cards = active.entries.map((entry, idx)=>{
    const planEx = plan.exercises.find(e=>e.id===entry.planExerciseId);
    const rest = effectiveRest(entry.performedName, planEx.rest);
    const last = lastEntryFor(entry.performedName, active.id);
    const lastLine = last ? `Ostatnio (${fmtDate(last.session.date)}): ${setsSummary(last.entry.sets, entry.unit)}` : 'Brak wcześniejszych wyników.';
    const setsHtml = entry.sets.map((s, si)=>{
      let val = s.value + (entry.unit==='sec' ? ' s' : '');
      let w = (s.weight!=null && s.weight!=='') ? ' × '+s.weight+' kg' : '';
      return `<div class="set-row">
        <div class="idx">${si+1}</div>
        <div class="val">${val}${w}</div>
        ${s.note ? `<div class="note" data-action="editnote" data-idx="${idx}" data-si="${si}">${s.note}</div>` : ''}
        <button class="del" data-action="delset" data-idx="${idx}" data-si="${si}">×</button>
      </div>`;
    }).join('');
    const isSwapped = entry.performedName !== entry.plannedName;
    return `<div class="ex-card">
      <div class="ex-head">
        <div style="flex:1;">
          <input class="ex-name-input" data-action="rename" data-idx="${idx}" value="${entry.performedName}">
          ${isSwapped ? `<div class="plan-tag">plan: ${entry.plannedName}</div>` : ''}
        </div>
        <button class="rest-badge" data-action="editrest" data-idx="${idx}" data-name="${entry.performedName}">⏱ ${rest}s</button>
      </div>
      <div class="last-time">${lastLine}</div>
      <input class="ctx-input" placeholder="uwaga / lokalizacja (np. solvay, park wodny)" data-action="ctx" data-idx="${idx}" value="${entry.context||''}">
      <div class="sets">${setsHtml}</div>
      <div class="add-set">
        <input type="number" inputmode="decimal" placeholder="${entry.unit==='sec'?'sek':'powt'}" data-role="val" data-idx="${idx}">
        <input type="number" inputmode="decimal" placeholder="kg" data-role="weight" data-idx="${idx}">
        <button data-action="addset" data-idx="${idx}">Zapisz</button>
      </div>
      ${entry.sets.length ? `<div class="quick-row"><button data-action="repeat" data-idx="${idx}">Powtórz ostatnią serię</button></div>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="topbar">
      <div>
        <div class="plan-label">Trening ${active.plan}</div>
        <div class="date-label">${fmtDate(active.date)}</div>

function chartDataFor(name){
  const pts = [];
  sessions.forEach(s=>{
    let best = null;
    s.entries.forEach(e=>{
      if(e.performedName!==name) return;
      e.sets.forEach(set=>{
        const metric = set.weight!=null ? set.weight : set.value;
        if(metric==null) return;
        if(best===null || metric>best) best = metric;
      });
    });
    if(best!==null) pts.push({date:s.date, value:best});
  });
  pts.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return pts;
}

function miniChartSvg(pts, unitSuffix){
  if(pts.length<2) return '';
  const w=300,h=100,pad=10;
  const vals = pts.map(p=>p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const stepX = (w-pad*2)/(pts.length-1);
  const coords = pts.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.value-min)/range)*(h-pad*2);
    return {x,y,v:p.value};
  });
  const line = coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="var(--accent)"></circle>`).join('');
  const first = pts[0], last = pts[pts.length-1];
  return `<div class="chart-wrap">
    <div class="ct">Najlepsza seria w treningu (${first.value}${unitSuffix} → ${last.value}${unitSuffix})</div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"></polyline>
      ${dots}
    </svg>
  </div>`;
}

function computeStats(){
  const prMap = {};
  sessions.forEach(s=>s.entries.forEach(e=>{
    e.sets.forEach(set=>{
      const metric = set.weight!=null ? set.weight : set.value;
      if(metric==null) return;
      const unit = set.weight!=null ? 'kg' : (e.unit==='sec' ? 's' : 'powt.');
      const cur = prMap[e.performedName];
      if(!cur || metric>cur.value){
        prMap[e.performedName] = { value:metric, unit, date:s.date };
      }
    });
  }));
  return prMap;
}

function renderStats(){

}

function renderCalendar(){
  if(!calMonth) calMonth = new Date();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y,m,1);
  const daysInMonth = new Date(y,m+1,0).getDate();
  let startOffset = first.getDay(); // 0=Sun
  startOffset = startOffset===0 ? 6 : startOffset-1; // Monday-first
  const byDate = sessionsByDate();
  const monthLabel = first.toLocaleDateString('pl-PL', {month:'long', year:'numeric'});
  const dows = ['pon','wt','śr','czw','pt','sob','nie'];
  let cells = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const daySessions = byDate[iso];
    const has = daySessions && daySessions.length;
    const label = has ? daySessions.map(s=>s.plan).join('/') : '';
    cells += `<div class="cal-day ${has?'has':''}" ${has?`data-action="cal-day" data-date="${iso}"`:''}>
      <div class="dn">${d}</div>
      ${has ? `<div class="pl">${label}</div>` : ''}
    </div>`;
  }
  return `
    <div class="topbar">
      <div class="plan-label">Kalendarz</div>
      <button class="icon-btn" data-action="home">Wróć</button>
    </div>
    <div class="history-view">

}

function renderRestBar(){
  let existing = document.getElementById('restBar');
  if(existing) existing.remove();
  if(!timer.running) return;
  const pct = timer.total>0 ? timer.remaining/timer.total : 0;
  const r = 24, c = 2*Math.PI*r;
  const off = c*(1-pct);
  const div = document.createElement('div');
  div.className = 'rest-bar';
  div.id = 'restBar';
  div.innerHTML = `
    <div class="ring-wrap">
      <svg width="56" height="56">
        <circle cx="28" cy="28" r="${r}" stroke="var(--surface2)" stroke-width="6" fill="none"></circle>
        <circle cx="28" cy="28" r="${r}" stroke="var(--rest)" stroke-width="6" fill="none"
          stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"></circle>
      </svg>
      <div class="n">${timer.remaining}</div>
    </div>
    <div class="rest-info">
      <div class="lbl">Przerwa</div>
      <div class="ex">${timer.exName}</div>
    </div>
    <div class="rest-actions">
      <button type="button" id="restMinusBtn">-15</button>
      <button type="button" id="restPlusBtn">+15</button>
      <button type="button" id="restSkipBtn">Pomiń</button>
    </div>
  `;
  document.body.appendChild(div);
  div.querySelector('#restMinusBtn').onclick = ()=>{
    timer.remaining = Math.max(0, timer.remaining-15);
    renderRestBar();
  };
  div.querySelector('#restPlusBtn').onclick = ()=>{
    timer.remaining += 15;
    timer.total = Math.max(timer.total, timer.remaining);
    renderRestBar();
  };
  div.querySelector('#restSkipBtn').onclick = ()=>{
    if(timer.handle) clearInterval(timer.handle);
    timer.running = false;
    renderRestBar();
  };
}

function startRest(seconds, entryIdx, exName){
  if(timer.handle) clearInterval(timer.handle);
  timer = { running:true, remaining:seconds, total:seconds, entryIdx, exName, handle:null };
  timer.handle = setInterval(()=>{
    timer.remaining--;
    if(timer.remaining<=0){
      clearInterval(timer.handle);
      timer.running = false;
      try{ if(navigator.vibrate) navigator.vibrate([200,80,200]); }catch(e){}
      playBeep();
    }
    renderRestBar();
  }, 1000);
  renderRestBar();
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 350);
  }catch(e){}
}

function parseSetsInput(text, unit){
  if(!text || !text.trim()) return [];
  const t = text.trim();
  // Skrót "3x5x60" -> 3 identyczne serie po 5 (lub sekund) x 60kg
  const shorthand = t.match(/^(\d+)\s*x\s*(\d+)\s*x\s*(\d+(?:[.,]\d+)?)$/i);
  if(shorthand){
    const n = +shorthand[1], val = +shorthand[2], w = +shorthand[3].replace(',','.');
    return Array.from({length:n}, ()=>({value:val, weight:w, note:''}));
  }
  // Skrót "3x10" (bez ciężaru, np. plank/serie bez obciążenia) -> 3 serie po 10
  const shorthand2 = t.match(/^(\d+)\s*x\s*(\d+)$/i);
  if(shorthand2 && unit==='sec'){
    const n = +shorthand2[1], val = +shorthand2[2];
    return Array.from({length:n}, ()=>({value:val, weight:null, note:''}));
  }
  // Lista pojedynczych serii: "10x60, 10x60, 8x55 (5)" albo "30,30,50"
  return t.split(',').map(chunk=>{
    chunk = chunk.trim();
    if(!chunk) return null;
    const m = chunk.match(/^(\d+(?:[.,]\d+)?)\s*(?:x\s*(\d+(?:[.,]\d+)?))?\s*(?:\(([^)]*)\))?$/i);
    if(!m) return { value:0, weight:null, note:chunk };
    return {
      value: +m[1].replace(',','.'),
      weight: m[2] ? +m[2].replace(',','.') : null,
      note: m[3] || ''
    };
  }).filter(Boolean);
}

async function saveActive(){ await stSet('activeSession', active); }

function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = async (e)=>{
      const a = el.dataset.action;
      if(a==='start'){
        const key = el.dataset.plan;
        if(active && !confirm('Masz niezakończony trening. Zacząć nowy i utracić postęp?')) return;
        const plan = PLANS[key];
        active = {
          id: uid('sess'),
          date: todayISO(),
          plan: key,
          entries: plan.exercises.map(ex=>({
            planExerciseId: ex.id,
            plannedName: ex.name,
            performedName: ex.name,
            unit: ex.unit,
            context: '',
            sets: []
          }))
        };
        await saveActive();
        view = 'session'; render();
      }
      else if(a==='resume'){ view='session'; render(); }
      else if(a==='home'){ view='home'; render(); }
      else if(a==='history'){ view='history'; render(); }
      else if(a==='stats'){ view='stats'; render(); }
      else if(a==='calendar'){ calMonth = new Date(); view='calendar'; render(); }
      else if(a==='editplans'){ plansEditTab='A'; view='editplans'; render(); }
      else if(a==='cal-prev'){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); render(); }
      else if(a==='cal-next'){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); render(); }
      else if(a==='cal-day'){
        const iso = el.dataset.date;
        const day = sessionsByDate()[iso];
        const lines = day.map(s=>{
          const exLines = s.entries.filter(e=>e.sets.length).map(e=>`• ${e.performedName}: ${setsSummary(e.sets, e.unit)}`).join('\n');
          return `Trening ${s.plan}\n${exLines}`;
        }).join('\n\n');
        alert(fmtDate(iso)+'\n\n'+lines);
      }
      else if(a==='edit-session'){
        editingSessionId = el.dataset.sessid;
        view = 'editsession'; render();
      }
      else if(a==='es-rename'){
        // obsłużone w onchange poniżej, ale zostawiamy pusty branch dla spójności delegacji kliknięć
      }
      else if(a==='es-unit'){
        const idx = +el.dataset.idx;
        const s = findSession(editingSessionId);
        s.entries[idx].unit = s.entries[idx].unit==='sec' ? 'reps' : 'sec';
        await saveSessions();
        render();
      }
      else if(a==='es-editval'){
        const idx = +el.dataset.idx, si = +el.dataset.si;
        const s = findSession(editingSessionId);
        const entry = s.entries[idx];
        const set = entry.sets[si];
        const cur = set.value + (set.weight!=null ? 'x'+set.weight : '') + (set.note ? ' ('+set.note+')' : '');
        const nn = prompt('Popraw serię (np. 10x60 albo 10x60 (uwaga)):', cur);
        if(nn===null) return;
        const parsed = parseSetsInput(nn, entry.unit);
        if(parsed.length) entry.sets[si] = parsed[0];
        await saveSessions();
        render();
      }
      else if(a==='es-delset'){
        const idx = +el.dataset.idx, si = +el.dataset.si;
        if(!confirm('Usunąć tę serię?')) return;
        const s = findSession(editingSessionId);
        s.entries[idx].sets.splice(si,1);
        await saveSessions();
        render();
      }
      else if(a==='es-addset'){
        const idx = +el.dataset.idx;
        const card = el.closest('.ex-card');
        const valInput = card.querySelector('[data-role="es-val"]');
        const wInput = card.querySelector('[data-role="es-weight"]');
        if(valInput.value===''){ valInput.focus(); return; }
        const s = findSession(editingSessionId);
        s.entries[idx].sets.push({ value:+valInput.value, weight: wInput.value===''?null:+wInput.value, note:'' });
        await saveSessions();
        render();
      }
      else if(a==='es-delentry'){
        if(!confirm('Usunąć to ćwiczenie z tej sesji?')) return;
        const idx = +el.dataset.idx;
        const s = findSession(editingSessionId);
        s.entries.splice(idx,1);
        await saveSessions();
        render();
      }
      else if(a==='es-addentry'){
        const s = findSession(editingSessionId);
        s.entries.push({ planExerciseId:null, plannedName:'Nowe ćwiczenie', performedName:'Nowe ćwiczenie', unit:'reps', context:'', sets:[] });
        await saveSessions();
        render();
      }
      else if(a==='es-delsession'){
        if(!confirm('Usunąć całą tę sesję treningową? Tej operacji nie da się cofnąć.')) return;
        sessions = sessions.filter(x=>x.id!==editingSessionId);
        await saveSessions();
        editingSessionId = null;
        view = 'history'; render();
      }
      else if(a==='pe-tab'){ plansEditTab = el.dataset.plan; render(); }
      else if(a==='pe-add'){
        PLANS[plansEditTab].exercises.push({ id: uid('ex'), name:'Nowe ćwiczenie', unit:'reps', rest:90 });
        await stSet('plans', PLANS);
        render();
      }
      else if(a==='pe-del'){
        if(!confirm('Usunąć to ćwiczenie z planu?')) return;
        PLANS[plansEditTab].exercises.splice(+el.dataset.idx,1);
        await stSet('plans', PLANS);
        render();
      }
      else if(a==='pe-unit'){
        const idx = +el.dataset.idx;
        const ex = PLANS[plansEditTab].exercises[idx];
        ex.unit = ex.unit==='sec' ? 'reps' : 'sec';
        await stSet('plans', PLANS);
        render();
      }
      else if(a==='pe-up'){
        const idx = +el.dataset.idx;
        if(idx===0) return;
        const arr = PLANS[plansEditTab].exercises;
        [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
        await stSet('plans', PLANS);
        render();
      }
      else if(a==='pe-down'){
        const idx = +el.dataset.idx;
        const arr = PLANS[plansEditTab].exercises;
        if(idx>=arr.length-1) return;
        [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
        await stSet('plans', PLANS);
        render();
      }
      else if(a==='pe-reset'){
        if(!confirm('Przywrócić domyślne ćwiczenia dla planu '+plansEditTab+'? Utracisz obecne zmiany w tym planie.')) return;
        PLANS[plansEditTab] = clonePlans()[plansEditTab];
        await stSet('plans', PLANS);
        render();
      }
      else if(a==='quickadd'){
        quickAdd = { date: todayISO(), plan: null, rows: [] };
        view='quickadd'; render();
      }
      else if(a==='qa-plan'){
        const key = el.dataset.plan;
        quickAdd.plan = key;
        quickAdd.rows = PLANS[key].exercises.map(ex=>newQuickAddRow(ex.name, ex.unit));
        render();
      }
      else if(a==='qa-addrow'){
        quickAdd.rows.push(newQuickAddRow('Nowe ćwiczenie', 'reps'));
        render();
      }
      else if(a==='qa-delrow'){
        quickAdd.rows.splice(+el.dataset.idx, 1);
        render();
      }
      else if(a==='qa-unit'){
        const idx = +el.dataset.idx;
        quickAdd.rows[idx].unit = quickAdd.rows[idx].unit==='sec' ? 'reps' : 'sec';
        render();
      }
      else if(a==='qa-save'){
        const dateVal = document.getElementById('qaDate').value;
        if(!dateVal){ alert('Podaj datę sesji.'); return; }
        const entries = [];
        quickAdd.rows.forEach(row=>{
          const sets = parseSetsInput(row.setsText, row.unit);
          if(sets.length===0) return;
          entries.push({
            planExerciseId: null,
            plannedName: row.performedName,
            performedName: row.performedName,
            unit: row.unit,
            context: row.context,
            sets: sets
          });
        });
        if(entries.length===0){ alert('Nie wpisano żadnych serii.'); return; }
        sessions.push({ id: uid('sess'), date: dateVal, plan: quickAdd.plan, entries });
        sessions.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
        await stSet('sessions', sessions);
        quickAdd = null;
        view = 'home'; render();
      }
      else if(a==='finish'){
        if(!confirm('Zakończyć i zapisać trening?')) return;
        sessions.push(active);
        await stSet('sessions', sessions);
        active = null;
        await stSet('activeSession', null);
        if(timer.handle) clearInterval(timer.handle);
        timer.running=false;
        view='home'; render();
      }
      else if(a==='addset'){
        const idx = +el.dataset.idx;
        const card = el.closest('.ex-card');
        const valInput = card.querySelector('[data-role="val"]');
        const wInput = card.querySelector('[data-role="weight"]');
        const val = valInput.value;
        if(val===''){ valInput.focus(); return; }
        const entry = active.entries[idx];
        entry.sets.push({ value:+val, weight: wInput.value===''? null : +wInput.value, note:'' });
        await saveActive();
        const planEx = PLANS[active.plan].exercises.find(e=>e.id===entry.planExerciseId);
        const rest = effectiveRest(entry.performedName, planEx.rest);
        startRest(rest, idx, entry.performedName);
        render();
      }
      else if(a==='repeat'){
        const idx = +el.dataset.idx;
        const entry = active.entries[idx];
        const lastSet = entry.sets[entry.sets.length-1];
        entry.sets.push({ ...lastSet, note:'' });
        await saveActive();
        const planEx = PLANS[active.plan].exercises.find(e=>e.id===entry.planExerciseId);
        const rest = effectiveRest(entry.performedName, planEx.rest);
        startRest(rest, idx, entry.performedName);
        render();
      }
      else if(a==='delset'){
        const idx = +el.dataset.idx, si = +el.dataset.si;
        if(!confirm('Usunąć tę serię?')) return;
        active.entries[idx].sets.splice(si,1);
        await saveActive();
        render();
      }
      else if(a==='editnote'){
        const idx = +el.dataset.idx, si = +el.dataset.si;
        const cur = active.entries[idx].sets[si].note || '';
        const nn = prompt('Uwaga do serii:', cur);
        if(nn===null) return;
        active.entries[idx].sets[si].note = nn;
        await saveActive();
        render();
      }
      else if(a==='editrest'){
        const name = el.dataset.name;
        const cur = restOverrides[name] != null ? restOverrides[name] : PLANS[active.plan].exercises.find(x=>x.name===active.entries[+el.dataset.idx].plannedName)?.rest;
        const nn = prompt('Domyślna przerwa (sekundy) dla: '+name, cur);
        if(nn===null || nn==='' || isNaN(+nn)) return;
        restOverrides[name] = +nn;
        await stSet('restOverrides', restOverrides);
        render();
      }
      else if(a==='restminus'){ timer.remaining = Math.max(0, timer.remaining-15); timer.total=Math.max(timer.total,timer.remaining); renderRestBar(); }
      else if(a==='restplus'){ timer.remaining += 15; timer.total = Math.max(timer.total, timer.remaining); renderRestBar(); }
      else if(a==='restskip'){ if(timer.handle) clearInterval(timer.handle); timer.running=false; renderRestBar(); }
    };
  });

  document.querySelectorAll('[data-action="rename"]').forEach(el=>{
    el.onchange = async ()=>{
      const idx = +el.dataset.idx;
      active.entries[idx].performedName = el.value || active.entries[idx].plannedName;
      await saveActive();
      render();
    };
  });
  document.querySelectorAll('[data-action="ctx"]').forEach(el=>{
    el.onchange = async ()=>{
      const idx = +el.dataset.idx;
      active.entries[idx].context = el.value;
      await saveActive();
    };
  });
  document.querySelectorAll('[data-action="qa-rename"]').forEach(el=>{
    el.onchange = ()=>{ quickAdd.rows[+el.dataset.idx].performedName = el.value; };
  });
  document.querySelectorAll('[data-action="qa-sets"]').forEach(el=>{
    el.onchange = ()=>{ quickAdd.rows[+el.dataset.idx].setsText = el.value; };
  });
  document.querySelectorAll('[data-action="qa-ctx"]').forEach(el=>{
    el.onchange = ()=>{ quickAdd.rows[+el.dataset.idx].context = el.value; };
  });
  document.querySelectorAll('[data-action="pe-rename"]').forEach(el=>{
    el.onchange = async ()=>{
      PLANS[plansEditTab].exercises[+el.dataset.idx].name = el.value || 'Ćwiczenie';
      await stSet('plans', PLANS);
    };
  });
  document.querySelectorAll('[data-action="pe-rest"]').forEach(el=>{
    el.onchange = async ()=>{
      const v = +el.value;
      PLANS[plansEditTab].exercises[+el.dataset.idx].rest = isNaN(v) ? 90 : v;
      await stSet('plans', PLANS);
    };
  });
  document.querySelectorAll('[data-action="es-rename"]').forEach(el=>{
    el.onchange = async ()=>{
      const s = findSession(editingSessionId);
      s.entries[+el.dataset.idx].performedName = el.value || 'Ćwiczenie';
      await saveSessions();
    };
  });
  document.querySelectorAll('[data-action="es-ctx"]').forEach(el=>{
    el.onchange = async ()=>{
      const s = findSession(editingSessionId);
      s.entries[+el.dataset.idx].context = el.value;
      await saveSessions();
    };
  });
  const esDateEl = document.getElementById('esDate');
  if(esDateEl){
    esDateEl.onchange = async ()=>{
      const s = findSession(editingSessionId);
      s.date = esDateEl.value;
      sessions.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      await saveSessions();
    };
  }
  const peNameEl = document.querySelector('[data-action="pe-planname"]');
  if(peNameEl){
    peNameEl.onchange = async ()=>{
      PLANS[plansEditTab].name = peNameEl.value || ('Trening '+plansEditTab);
      await stSet('plans', PLANS);
    };
  }
  const qaDateEl = document.getElementById('qaDate');
  if(qaDateEl){ qaDateEl.onchange = ()=>{ quickAdd.date = qaDateEl.value; }; }
  const histSel = document.getElementById('histSelect');
  if(histSel){
    histSel.onchange = ()=>{
      document.getElementById('root').innerHTML = renderHistory(histSel.value);
      bindEvents();
    };
  }
}

function showFatalError(msg){
  const root = document.getElementById('root');
  root.innerHTML = `<div style="padding:24px;color:#EDEAE2;font-family:sans-serif;">
    <div style="font-size:16px;font-weight:700;margin-bottom:10px;">Coś poszło nie tak przy uruchamianiu aplikacji</div>
    <div style="font-size:13px;color:#B0B4BB;line-height:1.5;">Spróbuj otworzyć ten plik bezpośrednio w przeglądarce (Safari/Chrome), a nie w podglądzie załącznika w WhatsApp/Mail — tam może nie działać JavaScript.</div>
    <div style="margin-top:14px;font-size:11px;color:#6b6f76;word-break:break-word;">Szczegóły: ${String(msg).slice(0,300)}</div>
  </div>`;
}
window.addEventListener('error', (e)=>{ showFatalError(e.message||e); });

(async function init(){
  try{
    sessions = await stGet('sessions', []);
    active = await stGet('activeSession', null);
    restOverrides = await stGet('restOverrides', {});
    PLANS = await stGet('plans', clonePlans());
    view = 'home';
    render();
  } catch(e){
    showFatalError(e && e.message ? e.message : e);
  }
})();
</script>
</body>
</html>
