<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #12161C; --surface: #1A2029; --surface2: #212836; --border: #2B3342;
      --gold: #C9A24B; --sage: #6FA287; --brick: #C1666B; --text: #EDE8DD; --muted: #8B93A3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 480px; margin: 0 auto; padding-bottom: 90px;
    }
    .mono { font-family: "SF Mono", "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
    .serif { font-family: Georgia, "Iowan Old Style", serif; }
    .header { display: flex; align-items: center; gap: 10px; padding: 20px 16px 0; }
    .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--gold); color: #1A1305;
      display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .card { margin: 18px 16px 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px; }
    .eyebrow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .balance { font-size: 38px; font-weight: 600; }
    .dashed { border-top: 1.5px dashed var(--border); margin: 16px 0 12px; }
    .progress-track { height: 6px; background: var(--surface2); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width .4s; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 13px;
      cursor: pointer; margin: 0 6px 8px 0; }
    .chip.active { border-color: var(--gold); background: rgba(201,162,75,.15); color: var(--gold); }
    input, select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
    input::placeholder { color: var(--muted); }
    .amount-input { background: transparent; border: none; text-align: right; font-family: Georgia, serif;
      font-size: 36px; width: 100%; }
    .btn { width: 100%; padding: 14px 0; border-radius: 14px; border: none; background: var(--gold);
      color: #1A1305; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn:disabled { background: var(--surface2); color: var(--muted); }
    .btn-secondary { background: var(--surface2); color: var(--text); }
    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px;
      background: rgba(26,32,41,.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border);
      display: flex; padding: 10px 8px 14px; }
    .tab-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center;
      gap: 4px; color: var(--muted); font-size: 10.5px; cursor: pointer; }
    .tab-btn.active { color: var(--gold); }
    .tx-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
    .tx-item:first-child { border-top: none; }
    .stamp { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 14px; }
    .toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--gold);
      color: #1A1305; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 50; }
    .hidden { display: none !important; }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 30px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    textarea { width: 100%; min-height: 110px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; color: var(--text); font-family: monospace; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo serif">zł</div>
    <div class="serif" style="font-size:18px;font-weight:600;">Kajet</div>
  </div>

  <div id="loading" class="spinner"></div>

  <div id="screen-dashboard" class="hidden"></div>
  <div id="screen-add" class="hidden"></div>
  <div id="screen-import" class="hidden"></div>
  <div id="screen-history" class="hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <div class="tabbar">
    <button class="tab-btn" data-tab="dashboard">📊<br>Podsumowanie</button>
    <button class="tab-btn" data-tab="add">➕<br>Dodaj</button>
    <button class="tab-btn" data-tab="import">🏦<br>Import CSV</button>
    <button class="tab-btn" data-tab="history">📜<br>Historia</button>
  </div>

<script>
const CAT_ICONS = { Jedzenie:"🍽️", Transport:"🚌", Mieszkanie:"🏠", Rozrywka:"🎬", Zdrowie:"💊", Inne:"⚪" };
const monthKey = new Date().toISOString().slice(0,7);
let categories = [];
let pendingImport = [];
let pieChart, lineChart;

function fmt(n){ return Number(n).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function showToast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'), 1800); }

function switchTab(tab){
  ['dashboard','add','import','history'].forEach(t=>{
    document.getElementById('screen-'+t).classList.toggle('hidden', t!==tab);
  });
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='dashboard') loadDashboard();
  if(tab==='history') loadHistory();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

/* ---------- start ---------- */
window.addEventListener('load', () => {
  google.script.run.withSuccessHandler(cats => {
    categories = cats;
    document.getElementById('loading').classList.add('hidden');
    renderAddScreen();
    renderImportScreen();
    switchTab('dashboard');
  }).getCategories();
});

/* ---------- DASHBOARD ---------- */
function loadDashboard(){
  const el = document.getElementById('screen-dashboard');
  el.innerHTML = '<div class="spinner"></div>';
  google.script.run.withSuccessHandler(data => renderDashboard(data)).getDashboardData(monthKey);
}

function renderDashboard(data){
  const el = document.getElementById('screen-dashboard');
  const remaining = data.budget - data.total;
  const pct = data.budget ? Math.min(100, (data.total/data.budget)*100) : 0;

  el.innerHTML = `
    <div class="card">
      <div class="eyebrow" style="margin-bottom:2px;">Wydatki w tym miesiącu</div>
      <div class="balance mono">${fmt(data.total)} <span style="font-size:16px;color:var(--muted);">zł</span></div>
      <div class="dashed"></div>
      <div class="row">
        <div class="eyebrow" style="margin:0;">Budżet: <span class="mono" style="color:var(--text)">${fmt(data.budget)} zł</span></div>
        <div class="mono" style="color:${remaining>=0?'var(--sage)':'var(--brick)'};font-size:13px;">
          ${remaining>=0?'+':''}${fmt(remaining)} zł
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${data.total>data.budget?'var(--brick)':'var(--gold)'}"></div></div>
    </div>

    <div class="card">
      <div class="eyebrow">Wydatki wg kategorii</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:120px;height:120px;flex-shrink:0;"><canvas id="pieChart"></canvas></div>
        <div style="flex:1;">
          ${data.breakdown.map(c=>`
            <div class="row" style="margin-bottom:7px;">
              <span style="font-size:12.5px;"><span style="color:${c.color}">●</span> ${c.name}</span>
              <span class="mono" style="font-size:12.5px;color:var(--muted);">${fmt(c.value)} zł</span>
            </div>`).join('') || '<div style="color:var(--muted);font-size:13px;">Brak wydatków w tym miesiącu</div>'}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Trend — 6 miesięcy</div>
      <div style="height:130px;"><canvas id="lineChart"></canvas></div>
    </div>
  `;

  if(pieChart) pieChart.destroy();
  if(data.breakdown.length){
    pieChart = new Chart(document.getElementById('pieChart'), {
      type: 'doughnut',
      data: { labels: data.breakdown.map(c=>c.name), datasets:[{ data:data.breakdown.map(c=>c.value),
        backgroundColor:data.breakdown.map(c=>c.color), borderWidth:0 }] },
      options: { plugins:{legend:{display:false}}, cutout:'62%' }
    });
  }
  if(lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type:'line',
    data:{ labels:data.trend.map(t=>t.month), datasets:[{ data:data.trend.map(t=>t.value),
      borderColor:'#C9A24B', backgroundColor:'rgba(201,162,75,.15)', fill:true, tension:.35, pointRadius:3 }] },
    options:{ plugins:{legend:{display:false}},
      scales:{ x:{ ticks:{color:'#8B93A3',font:{size:10}}, grid:{display:false} },
               y:{ ticks:{color:'#8B93A3',font:{size:10}}, grid:{color:'#2B3342'} } } }
  });
}

/* ---------- DODAJ ---------- */
function renderAddScreen(){
  const el = document.getElementById('screen-add');
  el.innerHTML = `
    <div style="padding:18px 16px 0;">
      <div class="eyebrow">Nowy wydatek</div>
      <div class="card" style="margin:0 0 14px;display:flex;align-items:baseline;justify-content:center;">
        <input id="amountInput" class="amount-input" placeholder="0,00" inputmode="decimal">
        <span style="color:var(--muted);margin-left:6px;">zł</span>
      </div>
      <div class="eyebrow">Kategoria</div>
      <div id="catChips" style="margin-bottom:14px;">
        ${categories.map((c,i)=>`<span class="chip ${i===0?'active':''}" data-cat="${c.name}">${CAT_ICONS[c.name]||'●'} ${c.name}</span>`).join('')}
      </div>
      <div class="eyebrow">Notatka</div>
      <input id="noteInput" placeholder="np. Zakupy w Lidlu" style="margin-bottom:14px;">
      <div class="eyebrow">Data</div>
      <input id="dateInput" type="date" style="margin-bottom:20px;">
      <button class="btn" id="saveBtn">Zapisz wydatek</button>
    </div>
  `;
  document.getElementById('dateInput').value = new Date().toISOString().slice(0,10);
  let selectedCat = categories[0] ? categories[0].name : null;
  el.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      el.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active'); selectedCat = chip.dataset.cat;
    });
  });
  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const amount = parseFloat(document.getElementById('amountInput').value.replace(',','.'));
    if(!amount || amount<=0){ showToast('Podaj poprawną kwotę'); return; }
    const tx = { date:document.getElementById('dateInput').value, category:selectedCat,
      amount, note:document.getElementById('noteInput').value };
    google.script.run.withSuccessHandler(()=>{
      showToast('Wydatek zapisany');
      document.getElementById('amountInput').value=''; document.getElementById('noteInput').value='';
      switchTab('dashboard');
    }).addTransaction(tx);
  });
}

/* ---------- IMPORT CSV ---------- */
function renderImportScreen(){
  const el = document.getElementById('screen-import');
  el.innerHTML = `
    <div style="padding:18px 16px 0;">
      <div class="eyebrow">Import z banku (PKO / iPKO)</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
        Pobierz historię transakcji z iPKO w formacie CSV i wklej jej zawartość poniżej.
      </div>
      <textarea id="csvInput" placeholder="Wklej tutaj zawartość pliku CSV..."></textarea>
      <button class="btn" style="margin-top:12px;" id="parseBtn">Wczytaj i sprawdź</button>
      <div id="importResult" style="margin-top:16px;"></div>
    </div>
  `;
  document.getElementById('parseBtn').addEventListener('click', ()=>{
    const csv = document.getElementById('csvInput').value;
    if(!csv.trim()){ showToast('Wklej najpierw plik CSV'); return; }
    document.getElementById('importResult').innerHTML = '<div class="spinner"></div>';
    google.script.run.withSuccessHandler(renderImportPreview).previewImport(csv, null);
  });
}

function renderImportPreview(res){
  const box = document.getElementById('importResult');
  if(res.error){ box.innerHTML = `<div style="color:var(--brick);">${res.error}</div>`; return; }
  if(res.mappingNeeded){
    box.innerHTML = `
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px;">
        Nie udało się automatycznie rozpoznać kolumn. Wykryte nagłówki:
      </div>
      <div class="mono" style="font-size:11.5px;color:var(--text);background:var(--surface);padding:10px;border-radius:10px;">
        ${res.headers.join(' | ')}
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:8px;">
        Napisz do mnie w czacie, podając te nagłówki — dostosuję mapowanie kolumn.
      </div>`;
    return;
  }
  pendingImport = res.transactions;
  const dupes = pendingImport.filter(t=>t.duplicate).length;
  box.innerHTML = `
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">
      Znaleziono ${pendingImport.length} transakcji ${dupes?('(w tym '+dupes+' możliwych duplikatów, wyszarzone)'):''}.
      Sprawdź kategorie — możesz je zmienić przed zapisaniem.
    </div>
    <div style="max-height:340px;overflow-y:auto;">
      ${pendingImport.map((t,i)=>`
        <div class="tx-item" style="${t.duplicate?'opacity:.5;':''}">
          <div style="flex:1;min-width:0;">
            <div style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.note}</div>
            <div style="font-size:11px;color:var(--muted);">${t.date}</div>
          </div>
          <select data-idx="${i}" class="import-cat-select" style="width:auto;padding:6px 8px;font-size:12px;">
            ${categories.map(c=>`<option value="${c.name}" ${c.name===t.category?'selected':''}>${c.name}</option>`).join('')}
          </select>
          <span class="mono" style="font-size:12.5px;min-width:70px;text-align:right;">${fmt(t.amount)} zł</span>
        </div>`).join('')}
    </div>
    <button class="btn" style="margin-top:14px;" id="commitBtn">Zaimportuj ${pendingImport.filter(t=>!t.duplicate).length} transakcji</button>
  `;
  document.querySelectorAll('.import-cat-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{ pendingImport[sel.dataset.idx].category = sel.value; });
  });
  document.getElementById('commitBtn').addEventListener('click', ()=>{
    const toImport = pendingImport.filter(t=>!t.duplicate);
    google.script.run.withSuccessHandler(()=>{
      showToast(`Zaimportowano ${toImport.length} transakcji`);
      document.getElementById('csvInput').value=''; box.innerHTML='';
      switchTab('dashboard');
    }).commitImport(toImport);
  });
}

/* ---------- HISTORIA ---------- */
function loadHistory(){
  const el = document.getElementById('screen-history');
  el.innerHTML = '<div class="spinner"></div>';
  google.script.run.withSuccessHandler(renderHistory).getTransactions();
}

function renderHistory(tx){
  const el = document.getElementById('screen-history');
  const sorted = tx.sort((a,b)=> a.date < b.date ? 1 : -1);
  el.innerHTML = `
    <div style="padding:18px 16px 0;">
      <div class="eyebrow">Historia transakcji</div>
      <div class="card" style="padding:6px 14px;">
        ${sorted.map(t=>`
          <div class="tx-item">
            <div class="stamp" style="background:${(categories.find(c=>c.name===t.category)||{}).color||'#8B93A3'}22;">
              ${CAT_ICONS[t.category]||'●'}
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${t.note||t.category}</div>
              <div style="font-size:11.5px;color:var(--muted);">${t.category} · ${t.date}</div>
            </div>
            <div class="mono" style="font-size:14px;">−${fmt(t.amount)} zł</div>
          </div>`).join('') || '<div style="color:var(--muted);padding:12px 0;">Brak transakcji</div>'}
      </div>
    </div>
  `;
}
</script>
</body>
</html>
